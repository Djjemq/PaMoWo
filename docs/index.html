<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Juego de idiomas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#eceeff;--ink:#14143a;--card:#fff;--yel:#ffd23f;--ok:#0f7a48;--bad:#c42a3b;--mute:#555a85;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12122e;--ink:#f4f3ff;--card:#1d1d44;--ok:#5fe0a0;--bad:#ff8a95;--mute:#a9acd6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12122e;--ink:#f4f3ff;--card:#1d1d44;--ok:#5fe0a0;--bad:#ff8a95;--mute:#a9acd6;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Atkinson Hyperlegible",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:22px 16px 56px}
h1,h2,h3,.big{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.1;margin:0 0 .4em}
h1 span{display:block}h1 span:first-child{font-size:2.5rem;font-weight:800}h1 span+span{font-size:1.05rem;font-weight:600;color:var(--mute);margin-top:4px}
h1.t2{font-size:2.6rem;font-weight:800}h2{font-size:1.9rem;font-weight:800}h3{font-size:1.3rem}
.hero{margin:18px 0 22px}.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--ink);padding:16px;margin:0 0 20px}
button{font:inherit;font-weight:700;cursor:pointer;border:3px solid var(--ink);border-radius:12px;padding:9px 16px;background:var(--card);color:var(--ink);box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
button:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
button:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
button.p{background:var(--ink);color:var(--bg)}
button[aria-pressed=true]{background:var(--yel);color:#14143a}
button:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none}
:focus-visible{outline:3px solid var(--bad);outline-offset:3px}
input[type=text]{width:100%;font:inherit;padding:10px 12px;border:3px solid var(--ink);border-radius:12px;background:var(--bg);color:var(--ink);margin-bottom:8px}
label{display:block;font-weight:700;margin:10px 0 4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px}
button.lc{background:var(--c);color:var(--f);border-radius:20px;padding:20px;text-align:left;display:flex;flex-direction:column;min-height:130px;justify-content:flex-end;box-shadow:6px 6px 0 var(--ink);animation:pop .5s cubic-bezier(.2,1.4,.4,1) backwards}
.lc:nth-child(odd){transform:rotate(-1.2deg)}.lc:nth-child(even){transform:rotate(1deg)}.lc:nth-child(2){animation-delay:.1s}.lc:nth-child(3){animation-delay:.2s}
.lc b{font:800 2.3rem/1.1 "Bricolage Grotesque",sans-serif}
.pill{margin-bottom:18px;font-size:.95rem}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);margin-right:6px;vertical-align:-1px}
.lv{display:block;width:100%;text-align:left;margin-bottom:10px}
.n1{width:56px;height:56px;font-size:1.3rem;padding:0;border-radius:50%}
.fc{border:3px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--ink);overflow:hidden;margin:0 0 20px;background:var(--card)}
.fh{background:var(--c);color:var(--f);padding:12px 16px}.fh b{font:800 1.9rem/1.1 "Bricolage Grotesque",sans-serif;display:block;margin-bottom:6px}
.tag{display:inline-block;border:2px solid currentColor;border-radius:8px;padding:0 9px;margin:0 6px 4px 0;font-size:.92rem;font-weight:700}
.fb{padding:8px 16px 10px}.dots{margin:0 0 18px}
.d{display:inline-block;width:16px;height:16px;border:3px solid var(--ink);border-radius:50%;margin-right:7px}.d.on{background:var(--yel)}
.win{background:var(--yel);color:#14143a}.win .big{font-size:2rem;font-weight:800;margin-bottom:12px}
.bar{height:16px;border:3px solid #14143a;border-radius:9px;background:#fff;overflow:hidden;min-width:90px}.bar i{display:block;height:100%;background:var(--c)}
table{width:100%;border-collapse:collapse}td,th{padding:6px 6px 6px 0;text-align:left}
.sh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.pt{font:800 1.7rem/1 "Bricolage Grotesque",sans-serif}
.orig{font-size:1.2rem;font-weight:700;margin:6px 0 10px}
.chip{display:inline-block;border:2px solid currentColor;border-radius:8px;padding:1px 9px;margin:0 6px 6px 0;font-size:.9rem;font-weight:700;animation:pop .35s backwards;animation-delay:calc(var(--d)*90ms)}
.y{color:var(--ok)}.n{color:var(--bad)}
.note{margin:4px 0}.tip{margin:4px 0;color:var(--mute)}
.corr{border:3px dashed var(--ink);border-radius:12px;padding:8px 12px;margin:10px 0;font-weight:700}.corr small{display:block;font-weight:400;color:var(--mute)}
.info{border:3px dashed var(--ink);border-radius:12px;padding:10px 14px;margin:0 0 20px;font-size:.95rem}.mute{color:var(--mute)}
@keyframes pop{from{opacity:0;scale:.85;translate:0 12px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"><p>Cargando la base de datos (la primera vez descarga unos MB)…</p></main>
<script type="module">
import { PGlite } from 'https://cdn.jsdelivr.net/npm/@electric-sql/pglite@0.5.13/dist/index.js';
import { createApi } from './api.js';
const db = new PGlite('idb://juego-idiomas'); // se guarda en este navegador (IndexedDB)
if (!(await db.query("select to_regclass('public.verbos') as t")).rows[0].t) {
  await db.exec(await (await fetch('./schema.sql')).text());
  await db.exec(await (await fetch('./seed.sql')).text());
}
const A = createApi(db);
const D={es:{n:'Español',t:['presente','pretérito','imperfecto','futuro']},fr:{n:'Français',t:['présent','passé composé','imparfait','futur simple']},en:{n:'English',t:['present','past','future','present perfect']}};
const LC={es:'#ff8a3d',fr:'#2a4fe0',en:'#d6285f'},LF={es:'#14143a',fr:'#fff',en:'#fff'},HI={es:'Hola',fr:'Bonjour',en:'Hello'};
const T={
es:{q1:'¿Qué idioma hablas?',q2:'¿Qué idioma quieres aprender?',back:'Atrás',title:'Juego de idiomas',intro:'Practica verbos escribiendo tus propias frases.',you:'Hablo',learn:'Aprendo',change:'Cambiar',players:'Jugadores',pn:'Nombre del jugador {n}',pd:'Jugador',level:'Nivel',lvls:['1 · Verbos regulares','2 · Regulares e irregulares','3 · Todos los verbos y tiempos','4 · Frases de 6 palabras o más'],tenses:'Tiempos verbales',start:'Empezar partida',turn:'Turno de {n}',turnSub:'Pasa el dispositivo. Nadie más debe ver tus retos.',see:'Ver mis tres retos',write:'{n}, escribe tres frases',writeSub:'Usa exactamente la forma pedida.',person:'persona',yours:'Tu frase',next:'Terminar turno',fin:'Ver resultados',res:'Resultados',wins:'Gana {n}',tie:'Empate: {n}',and:' y ',pl:'Jugador',rd:'Esta ronda',tt:'Total',crit:['Conjugación','Gramática','Coherencia y tiempo','Vocabulario y naturalidad'],claim:'Reclamar evaluación',ph:'¿Por qué crees que está mal evaluada?',send:'Enviar',claimed:'Reclamación registrada · pendiente de revisión',claimsT:'Reclamaciones pendientes',again:'Otra ronda',newg:'Nueva partida',corr:'Versión sugerida · tu frase original se conserva',mock:'Evaluación de prueba: solo comprueba el verbo, el tiempo y la forma de la frase. Errores de género, preposiciones o naturalidad los revisará la IA en una fase posterior.',nConj:'Conjugación y tiempo: se esperaba «{f}» ({v}, {t}, {p}).',nShort:'Gramática: la frase es muy corta (mínimo 3 palabras).',nRep:'Coherencia: hay palabras repetidas seguidas.',nVoc:'Vocabulario: usa al menos {m} palabras distintas.',tipCap:'Consejo (no resta puntos): empieza con mayúscula.',tipPunc:'Consejo (no resta puntos): termina con un punto u otro signo final.'},
fr:{q1:'Quelle langue parles-tu ?',q2:'Quelle langue veux-tu apprendre ?',back:'Retour',title:'Jeu de langues',intro:'Pratique les verbes en écrivant tes propres phrases.',you:'Je parle',learn:'J’apprends',change:'Changer',players:'Joueurs',pn:'Nom du joueur {n}',pd:'Joueur',level:'Niveau',lvls:['1 · Verbes réguliers','2 · Réguliers et irréguliers','3 · Tous les verbes et temps','4 · Phrases de 6 mots ou plus'],tenses:'Temps verbaux',start:'Commencer la partie',turn:'Tour de {n}',turnSub:'Passe l’appareil. Personne d’autre ne doit voir tes défis.',see:'Voir mes trois défis',write:'{n}, écris trois phrases',writeSub:'Utilise exactement la forme demandée.',person:'personne',yours:'Ta phrase',next:'Finir le tour',fin:'Voir les résultats',res:'Résultats',wins:'{n} gagne',tie:'Égalité : {n}',and:' et ',pl:'Joueur',rd:'Ce tour',tt:'Total',crit:['Conjugaison','Grammaire','Cohérence et temps','Vocabulaire et naturel'],claim:'Contester l’évaluation',ph:'Pourquoi penses-tu que c’est mal évalué ?',send:'Envoyer',claimed:'Contestation enregistrée · en attente de révision',claimsT:'Contestations en attente',again:'Un autre tour',newg:'Nouvelle partie',corr:'Version suggérée · ta phrase originale est conservée',mock:'Évaluation de test : elle vérifie seulement le verbe, le temps et la forme de la phrase. Genre, prépositions et naturel seront revus par l’IA plus tard.',nConj:'Conjugaison et temps : on attendait « {f} » ({v}, {t}, {p}).',nShort:'Grammaire : la phrase est trop courte (3 mots minimum).',nRep:'Cohérence : des mots sont répétés à la suite.',nVoc:'Vocabulaire : utilise au moins {m} mots différents.',tipCap:'Conseil (sans perte de points) : commence par une majuscule.',tipPunc:'Conseil (sans perte de points) : termine par un point ou un autre signe final.'},
en:{q1:'Which language do you speak?',q2:'Which language do you want to learn?',back:'Back',title:'Language game',intro:'Practise verbs by writing your own sentences.',you:'I speak',learn:'I’m learning',change:'Change',players:'Players',pn:'Player {n} name',pd:'Player',level:'Level',lvls:['1 · Regular verbs','2 · Regular and irregular','3 · All verbs and tenses','4 · Sentences of 6+ words'],tenses:'Tenses',start:'Start game',turn:'{n}’s turn',turnSub:'Pass the device. Nobody else should see your challenges.',see:'See my three challenges',write:'{n}, write three sentences',writeSub:'Use exactly the requested form.',person:'person',yours:'Your sentence',next:'Finish turn',fin:'See results',res:'Results',wins:'{n} wins',tie:'Tie: {n}',and:' and ',pl:'Player',rd:'Round',tt:'Total',crit:['Conjugation','Grammar','Coherence and tense','Vocabulary and naturalness'],claim:'Dispute score',ph:'Why do you think it was scored wrong?',send:'Send',claimed:'Dispute logged · awaiting review',claimsT:'Pending disputes',again:'Another round',newg:'New game',corr:'Suggested version · your original is kept',mock:'Test scoring: it only checks the verb, the tense and the shape of the sentence. Gender, prepositions and naturalness will be reviewed by AI in a later phase.',nConj:'Conjugation and tense: expected “{f}” ({v}, {t}, {p}).',nShort:'Grammar: the sentence is too short (3 words minimum).',nRep:'Coherence: some words are repeated back to back.',nVoc:'Vocabulary: use at least {m} different words.',tipCap:'Tip (no points lost): start with a capital letter.',tipPunc:'Tip (no points lost): end with a period or other final mark.'}
};
const S={s:'l1',c:{ui:null,lang:null,n:1,names:['','','',''],level:1,tenses:[0,1]},cur:0,chs:[],ans:[],ev:[],tot:[],claims:[],open:null};
const $=document.getElementById('app');
const t=(k,o)=>{let s=T[S.c.ui||'es'][k];if(o)for(const x in o)s=s.replace('{'+x+'}',o[x]);return s};
const esc=x=>String(x).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const cap=x=>x.charAt(0).toUpperCase()+x.slice(1);
const nm=i=>S.c.names[i].trim()||t('pd')+' '+(i+1);
const shuf=a=>a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const sty=k=>'--c:'+LC[k]+';--f:'+LF[k];
const lead=(p,f)=>p==='je'&&/^[aeiouhéèêàâîïôû]/i.test(f)?'J’'+f:cap(p)+' '+f;

function pick(step){
 S.s=step;const ks=Object.keys(D).filter(k=>step==='l1'||k!==S.c.ui);
 const q=step==='l1'?Object.keys(T).map(k=>'<span>'+T[k].q1+'</span>').join(''):'<span>'+t('q2')+'</span>';
 $.innerHTML=(step==='l2'?'<button id="bk">← '+t('back')+'</button>':'')+'<div class="hero"><h1>'+q+'</h1></div><div class="grid">'+ks.map(k=>'<button class="lc" data-l="'+k+'" style="'+sty(k)+'"><b>'+HI[k]+'</b><span>'+D[k].n+'</span></button>').join('')+'</div>';
 if(step==='l2')$.querySelector('#bk').onclick=()=>pick('l1');
 $.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{const k=b.dataset.l;if(step==='l1'){S.c.ui=k;document.documentElement.lang=k;pick('l2')}else{S.c.lang=k;S.c.tenses=[0,1];setup()}});
}
function setup(){
 S.s='setup';const c=S.c,L=D[c.lang];
 $.innerHTML='<button class="pill" id="chg"><span class="dot" style="background:'+LC[c.ui]+'"></span>'+t('you')+' '+D[c.ui].n+' &nbsp;→&nbsp; <span class="dot" style="background:'+LC[c.lang]+'"></span>'+t('learn')+' '+L.n+' &nbsp;·&nbsp; <u>'+t('change')+'</u></button>'+
 '<h1 class="t2">'+t('title')+'</h1><p class="sub">'+t('intro')+'</p>'+
 '<div class="card"><h3>'+t('players')+'</h3><div class="row">'+[1,2,3,4].map(n=>'<button class="n1" data-n="'+n+'" aria-pressed="'+(c.n===n)+'">'+n+'</button>').join('')+'</div>'+
 Array.from({length:c.n},(_,i)=>'<label for="nm'+i+'">'+t('pn',{n:i+1})+'</label><input type="text" id="nm'+i+'" maxlength="20" value="'+esc(c.names[i])+'" placeholder="'+t('pd')+' '+(i+1)+'">').join('')+'</div>'+
 '<div class="card"><h3>'+t('level')+'</h3>'+T[c.ui].lvls.map((x,i)=>'<button class="lv" data-lv="'+(i+1)+'" aria-pressed="'+(c.level===i+1)+'">'+x+'</button>').join('')+'</div>'+
 '<div class="card"><h3>'+t('tenses')+'</h3><div class="row">'+L.t.map((x,i)=>'<button data-t="'+i+'" aria-pressed="'+c.tenses.includes(i)+'">'+x+'</button>').join('')+'</div></div>'+
 '<button class="p" id="go"'+(c.tenses.length?'':' disabled')+'>'+t('start')+'</button>';
 $.querySelector('#chg').onclick=()=>pick('l1');
 $.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{c.n=+b.dataset.n;setup()});
 $.querySelectorAll('input').forEach((x,i)=>x.oninput=()=>c.names[i]=x.value);
 $.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{c.level=+b.dataset.lv;setup()});
 $.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const i=+b.dataset.t;c.tenses=c.tenses.includes(i)?c.tenses.filter(v=>v!==i):[...c.tenses,i];setup()});
 $.querySelector('#go').onclick=()=>{S.gid=null;S.tot=Array(c.n).fill(0);round()};
}
async function api(path,body){let m;
 if(path==='games')return A.newGame(body);if(path==='rounds')return A.newRound(body);
 if(path==='claims')return A.newClaim(body);
 if(m=path.match(/^rounds\/(\d+)\/answers$/))return A.answer(+m[1],body);
 throw new Error('Ruta no disponible: '+path)}
window.addEventListener('unhandledrejection',e=>$.insertAdjacentHTML('afterbegin','<div class="info">⚠ '+esc(e.reason.message)+'</div>'));
async function round(){
 if(!S.gid)S.gid=(await api('games',{lang:S.c.lang,ui:S.c.ui,level:S.c.level,tenses:S.c.tenses,players:S.c.names.slice(0,S.c.n).map((_,i)=>nm(i))})).id;
 const r=await api('rounds',{game:S.gid});S.rid=r.id;S.chs=r.challenges;S.cur=0;S.ans=Array.from({length:S.c.n},()=>['','','']);S.c.n===1?write():turn();
}
function turn(){
 S.s='turn';$.innerHTML='<div class="hero"><h2>'+t('turn',{n:esc(nm(S.cur))})+'</h2><p class="sub">'+t('turnSub')+'</p></div><button class="p" id="st">'+t('see')+'</button>';
 $.querySelector('#st').onclick=write;
}
function write(){
 S.s='write';const ch=S.chs[S.cur],k=S.c.lang;
 $.innerHTML='<h2>'+t('write',{n:esc(nm(S.cur))})+'</h2><p class="sub">'+t('writeSub')+'</p><div class="dots">'+ch.map((_,i)=>'<span class="d" id="d'+i+'"></span>').join('')+'</div>'+
 ch.map((x,i)=>'<div class="fc"><div class="fh" style="'+sty(k)+'"><b>'+esc(x.inf)+'</b><span class="tag">'+esc(x.tense)+'</span><span class="tag">'+t('person')+': '+esc(x.pron)+'</span></div><div class="fb"><label for="a'+i+'">'+t('yours')+' '+(i+1)+'</label><input type="text" id="a'+i+'" maxlength="200" autocomplete="off" value="'+esc(S.ans[S.cur][i])+'"></div></div>').join('')+
 '<button class="p" id="fin" disabled>'+(S.cur<S.c.n-1?t('next'):t('fin'))+'</button>';
 const f=$.querySelector('#fin'),ins=[...$.querySelectorAll('input')];
 const chk=()=>{ins.forEach((x,i)=>$.querySelector('#d'+i).classList.toggle('on',!!x.value.trim()));f.disabled=ins.some(x=>!x.value.trim())};
 ins.forEach((x,i)=>x.oninput=()=>{S.ans[S.cur][i]=x.value;chk()});chk();
 f.onclick=()=>{if(++S.cur<S.c.n)turn();else results()};
 window.scrollTo(0,0);
}
function decorate(ch,e,tx){
 const f=e.flags,c=e.c,notes=[],tips=[];
 if(!c[0])notes.push(t('nConj',{f:ch.form.split('|').join(' / '),v:ch.inf,t:ch.tense,p:ch.pron}));
 if(!c[1])notes.push(t('nShort'));
 if(c[0]&&f.rep)notes.push(t('nRep'));
 if(!c[3])notes.push(t('nVoc',{m:f.min}));
 if(f.noCap)tips.push(t('tipCap'));if(f.noPun)tips.push(t('tipPunc'));
 let corr=null;
 if(!c[0])corr=lead(ch.pron,ch.form.split('|')[0])+' …';
 else if(tips.length)corr=(f.noCap?cap(tx):tx)+(f.noPun?'.':'');
 return{...e,notes,tips,corr};
}
async function results(){
 const r=await api('rounds/'+S.rid+'/answers',{answers:S.ans});
 S.ev=r.evaluations.map((es,p)=>es.map((e,i)=>decorate(S.chs[p][i],e,S.ans[p][i])));
 S.tot=r.cumulative;S.s='res';show(r.totals);
}
function show(rt){
 const mx=Math.max(...rt),win=rt.map((v,i)=>v===mx?i:-1).filter(i=>i>=0),k=S.c.lang;
 const names=win.map(i=>esc(nm(i))).join(t('and'));
 let h='<div class="card win"><div class="big">🏆 '+(S.c.n===1?esc(nm(0))+': '+rt[0]+' / 12':(win.length>1?t('tie',{n:names}):t('wins',{n:names}))+' · '+mx)+'</div>'+
 '<table><tr><th>'+t('pl')+'</th><th>'+t('rd')+'</th><th>'+t('tt')+'</th></tr>'+rt.map((v,i)=>'<tr><td>'+esc(nm(i))+'</td><td><div class="bar" style="'+sty(k)+'" title="'+v+'/12"><i style="width:'+v/12*100+'%"></i></div></td><td><b>'+v+'/12</b> · '+S.tot[i]+'</td></tr>').join('')+'</table></div>'+
 '<div class="info">'+t('mock')+'</div>';
 S.ev.forEach((es,p)=>{h+='<h3>'+esc(nm(p))+'</h3>';es.forEach((e,i)=>{const c=S.chs[p][i],q=p+'-'+i,cl=S.claims.find(x=>x.k===q);
  h+='<div class="card"><div class="sh"><div><b>'+esc(c.inf)+'</b> <span class="mute">'+esc(c.tense)+' · '+esc(c.pron)+'</span></div><div class="pt">'+e.pts+'/4</div></div>'+
  '<div class="orig">“'+esc(S.ans[p][i])+'”</div>'+
  e.c.map((v,j)=>'<span class="chip '+(v?'y':'n')+'" style="--d:'+j+'">'+(v?'✓ ':'✗ ')+T[S.c.ui].crit[j]+'</span>').join('')+
  e.notes.map(n=>'<div class="note">'+esc(n)+'</div>').join('')+e.tips.map(n=>'<div class="tip">'+esc(n)+'</div>').join('')+
  (e.corr?'<div class="corr"><small>'+t('corr')+'</small>'+esc(e.corr)+'</div>':'')+
  (cl?'<div class="mute">'+t('claimed')+'</div>':S.open===q?'<div class="row"><input type="text" id="rz" placeholder="'+t('ph')+'" aria-label="'+t('ph')+'"><button class="p" data-send="'+q+'">'+t('send')+'</button></div>':'<button data-claim="'+q+'">'+t('claim')+'</button>')+'</div>';});});
 if(S.claims.length)h+='<div class="card"><h3>'+t('claimsT')+'</h3>'+S.claims.map(x=>'<div class="mute">“'+esc(x.oracion)+'” · '+x.pts+'/4 · '+esc(x.motivo)+'</div>').join('')+'</div>';
 h+='<div class="row"><button class="p" id="again">'+t('again')+'</button><button id="new">'+t('newg')+'</button></div>';
